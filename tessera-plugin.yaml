# Mealie: the meal planned in Mealie, from Home Assistant, on a tile with its picture, and the recipe (its ingredients
# and its steps, page by page) on the card a tap opens. The tile belongs to a Mealie calendar of the Mealie
# integration (calendar.mealie_dinner), or to a sensor the plugin's Home Assistant package makes straight from
# Mealie's API. A second tile shows a recipe chosen by hand on a select entity, with a picker a tap opens. The ingredients and the steps come from a script in Home Assistant (homeassistant/), asked through the
# app page by page: a screen never reaches Mealie itself. docs/MANIFEST.md of tessera-plugins has every field.
id: mealie
version: 0.1.0
api: "0.17"
icon: silverware-fork-knife
maintainer: vrklgn
license: MIT
stage: beta
topics: [home, calendar]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 16

permissions:
  # The choice of a recipe on the select tile's entity, and the step a steps tile moves on to in its number entity.
  home_assistant_actions: [input_select.select_option, select.select_option, input_number.set_value, number.set_value]
  # The recipe script of the plugin's Home Assistant package: a page of ingredients or steps, or the facts of a recipe.
  ha_commands: ["call_service:script.tessera_mealie"]
  # The meal the top bar's item reads, chosen when the plugin is added to a screen.
  read_entities: ["{meal}"]

inputs:
  - { id: meal, kind: entity, domains: [calendar, sensor], scope: screen, label: input_meal, hint: input_meal_hint }

tiles:
  - id: meal
    name: tile_name
    icon: silverware-fork-knife
    sizes: { min: 1x1, max: 4x4 }
    # The head, when it is, the name (two lines), the description, the facts, a note, and a place for the picture;
    # or up to 24 lines of ingredients.
    memory: 4000
    pictures: 1
    # A Mealie calendar (the integration), or a meal sensor of the plugin's package: both carry the meal as `message`,
    # its description, and the day it is planned for.
    domains: [calendar, sensor]
    attributes: [message, description, start_time]
    example: tile_example
    preview: { title: "{message}", badge: "{name}" }
    options:
      # The picture: an image entity of Home Assistant (the package makes image.tessera_mealie_dinner), shown through
      # Home Assistant's own image proxy (plugin API 0.15, an option of kind entity).
      - { id: picture, kind: entity, domains: [image], label: picture, hint: picture_hint }
      - { id: details, kind: toggle, default: true, label: details, hint: details_hint }
      - { id: description, kind: toggle, default: true, label: description, hint: description_hint }
      # What the tile shows (plugin API 0.15 for the entity option): the recipe, or its ingredients, or one step at a
      # time, large; the ingredients turn their page every `every` seconds; the step follows a number entity
      # (input_number.mealie_recipe_step), which a tap moves on, so voice or an automation can turn the page.
      - id: show
        kind: choice
        label: show
        hint: show_hint
        default: recipe
        choices:
          - { value: recipe, label: show_recipe }
          - { value: ingredients, label: show_ingredients }
          - { value: steps, label: show_steps }
      - { id: every, kind: number, min: 0, max: 120, step: 5, unit: s, default: 0, label: every, hint: every_hint }
      - { id: step, kind: entity, domains: [input_number, number], label: step, hint: step_hint }
  - id: pick
    name: pick_name
    icon: chef-hat
    sizes: { min: 1x1, max: 4x4 }
    # As the meal tile, and the recipes of the select to choose from (up to 64 names).
    memory: 7200
    pictures: 1
    # A select entity whose options are recipes and whose state is the one chosen: the package's
    # input_select.tessera_mealie_recipe, kept in step with Mealie, or a list of your own.
    domains: [input_select, select]
    attributes: [options]
    has_attributes: [options]
    example: pick_example
    preview: { title: "{state}", badge: "{name}" }
    options:
      - { id: picture, kind: entity, domains: [image], label: picture, hint: picture_pick_hint }
      - { id: details, kind: toggle, default: true, label: details, hint: details_hint }
      - { id: description, kind: toggle, default: true, label: description, hint: description_hint }
      # What the tile shows (plugin API 0.15 for the entity option): the recipe, or its ingredients, or one step at a
      # time, large; the ingredients turn their page every `every` seconds; the step follows a number entity
      # (input_number.mealie_recipe_step), which a tap moves on, so voice or an automation can turn the page.
      - id: show
        kind: choice
        label: show
        hint: show_hint
        default: recipe
        choices:
          - { value: recipe, label: show_recipe }
          - { value: ingredients, label: show_ingredients }
          - { value: steps, label: show_steps }
      - { id: every, kind: number, min: 0, max: 120, step: 5, unit: s, default: 0, label: every, hint: every_hint }
      - { id: step, kind: entity, domains: [input_number, number], label: step, hint: step_hint }

cards:
  # The recipe: the picture, the facts, and the ingredients and the steps page by page, a tap for the next page.
  - { id: recipe, name: card_name, pictures: 1 }
  # The picker: the recipes of the select tile, one per row, a tap chooses one and opens its recipe.
  - { id: choose, name: choose_name }

bar_items:
  - { id: today, label: bar_today, icon: silverware-fork-knife, example: bar_example }
